[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Скриншоты работ и картинка для соцсетей не меняются — пусть браузер держит их год.
# Если замените картинку, дайте ей новое имя, иначе у вернувшихся посетителей останется старая.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Базовая защита. HTML Netlify и так отдаёт без кеша, поэтому Cache-Control здесь не нужен.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
