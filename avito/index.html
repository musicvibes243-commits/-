<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авито — макеты объявления «Разработка сайтов»</title>
<style>
  :root { color-scheme: light; --bg: #F4F1EA; --fg: #2A2520; --muted: #6B5F4B; --card: #fff; }
  body.lux { --bg: #0B0A09; --fg: #F3DFA8; --muted: #9A8F7A; --card: #141310; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--fg); padding: 32px 16px 64px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 32px; line-height: 1.15; margin-bottom: 8px; }
  h2 { font-size: 20px; margin: 40px 0 14px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 8px; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(128,110,60,.45); background: transparent; color: var(--fg); cursor: pointer; }
  button[aria-pressed="true"] { background: #E8B21F; border-color: #E8B21F; color: #1B1608; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  figure { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 14px; font-size: 14px; color: var(--muted); }
  figcaption b { display: block; color: var(--fg); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Объявление на Авито: «Разработка сайтов»</h1>
  <p class="sub">Десять слайдов объявления в порядке показа + запасные. 1800×2400 px, две темы.</p>
  <div class="tabs">
    <button id="b-light" aria-pressed="true">Жёлтая</button>
    <button id="b-lux" aria-pressed="false">Тёмная</button>
  </div>

  <h2>Десять слайдов объявления</h2>
  <div class="grid" id="main"></div>

  <h2>Запасные</h2>
  <div class="grid" id="extra"></div>
</div>
<script>
const MAIN = [
  ["01-cover", "Обложка", "Акция до 30 сентября, 2 дня, 15 000 ₽"],
  ["02-blyudo-klosh", "Оффер", "Подаём готовым"],
  ["03-uslugi", "Услуги", "Что мы делаем"],
  ["04-kot-otdyhayte", "Кот", "Отдыхайте — мы всё сделаем"],
  ["05-zadachi-sayta", "Задачи сайта", "Что нужно для создания сайта"],
  ["06-struktura", "Структура", "И стратегия продвижения"],
  ["07-chto-podgotovit", "Материалы", "Что нужно от вас"],
  ["08-etapy-raboty", "Этапы", "Четыре шага до запуска"],
  ["09-zvezda-na-pyat", "Звезда", "Делаем на пять"],
  ["10-final-cta", "Финал", "Консультация бесплатна"],
];
const EXTRA = [
  ["citata-bryus-li", "Цитата", "Брюс Ли"],
  ["citata-eynshteyn", "Цитата", "Эйнштейн"],
  ["vy-ekspert", "Эксперт", "Вы — смысл, мы — упаковка"],
  ["gotovye-sayty", "Готовые сайты", "Установка — 2 дня"],
  ["podnos-perchatka", "Фото", "Цена на подносе"],
  ["podtyoki", "Фото", "Подтёки поверх текста"],
  ["plakat", "Плакат", "Редакционный стиль"],
  ["dzhinsy-nishi", "Ниши", "Сайт для магазина"],
];

const card = (dir, [f, t, d], n) =>
  `<figure><img src="${dir}/${f}.png" alt="${t}" loading="lazy">
   <figcaption><b>${n ? n + '. ' : ''}${t}</b>${d}</figcaption></figure>`;

const render = (dir) => {
  document.getElementById('main').innerHTML =
    MAIN.map((it, i) => card(dir, it, String(i + 1).padStart(2, '0'))).join('');
  document.getElementById('extra').innerHTML =
    EXTRA.map((it) => card(dir + '/extra', it, '')).join('');
};

const setTheme = (lux) => {
  document.body.classList.toggle('lux', lux);
  document.getElementById('b-light').ariaPressed = String(!lux);
  document.getElementById('b-lux').ariaPressed = String(lux);
  render(lux ? 'images-lux' : 'images');
};

document.getElementById('b-light').onclick = () => setTheme(false);
document.getElementById('b-lux').onclick = () => setTheme(true);
setTheme(false);
</script>
</body>
</html>
