<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F3ED">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Объекты — СтройИнвест</title>
<!--
  ОБЪЕКТЫ — записная книжка мастера.

  Зачем. Мастер держит всё в голове: кому обещал приехать, сколько взял
  авансом, какая на участке глубина до воды. Пока объектов три — это
  работает. На десяти начинает сыпаться, и сыпется всегда одинаково:
  забытый звонок и забытый аванс.

  Соседи по сайту: smeta.html — расчёт для разговора на объекте,
  kp.html — официальная бумага с реквизитами. Обе держат ровно один
  черновик: начал второй — первый затёрся. Здесь список, и затереть
  ничего нельзя.

  Открывается по адресу stroyinvest-mo.ru/obyekty.html. От поисковиков
  закрыта: noindex в шапке, запрет в robots.txt, в меню и карте сайта
  её нет.

  ГДЕ ЛЕЖАТ ЗАПИСИ. В самом телефоне, в памяти браузера. Не на сервере.
  Из этого два следствия, и оба важные:

    1. Работает без интернета. В траншее под Клином связи нет, а записать
       замер надо там же, пока он в руках.
    2. Записи живут в одном телефоне и в одном браузере. Почистил историю
       Safari «с удалением данных сайтов» — записи ушли. Поэтому в шапке
       есть «Копия», и делать её надо раз в неделю.

  ПОЧЕМУ НЕ СЕРВЕР. Сервер — это ежемесячные деньги и то, что умеет
  останавливаться: бот на Amvera встал, и вместе с ним встал расчёт
  на сайте. Записную книжку мастера терять так нельзя. Синхронизацию
  между двумя телефонами добавим, когда станет видно, что книжкой
  действительно пользуются каждый день.

  ГОЛОСОМ. Отдельной кнопки записи здесь нет и не надо: микрофон уже
  есть на клавиатуре телефона. Нажал на поле, нажал микрофон, наговорил.
  Распознаёт сам телефон, бесплатно и без интернета на новых iPhone.
  Своё распознавание означало бы платный сервис и ещё один сервер,
  который может лечь.

  НА ЭКРАН «ДОМОЙ». Safari → кнопка «Поделиться» → «На экран «Домой».
  Нарочно не включён режим отдельного приложения: в нём у страницы
  бывает своя, отдельная память, и записи, сделанные «из Safari»
  и «с иконки», могут разъехаться. Пусть будет одна память на всех.
-->
<style>
  :root{
    --ink:#23303A; --ink-2:#4A5A64; --muted:#7A8792;
    --line:#D8D2C7; --line-2:#ECE7DE;
    --paper:#FFFFFF; --tint:#F6F3ED;
    --accent:#C97A09; --accent-soft:#FDF3E2;
    --ok:#1F7A4D; --ok-soft:#E8F5EE;
    --alarm:#B3261E; --alarm-soft:#FDECEA;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:0 0 110px;background:var(--tint);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .obolochka{max-width:760px;margin:0 auto;padding:0 12px}

  /* ===== Шапка ===== */
  header{position:sticky;top:0;z-index:20;background:var(--tint);
    padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line-2)}
  .shapka{display:flex;align-items:center;gap:10px}
  .shapka h1{flex:1;margin:0;font-size:20px;letter-spacing:.01em}
  .shapka h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}

  button{font:inherit;color:inherit;cursor:pointer}
  .knopka{border:1px solid var(--line);background:var(--paper);border-radius:10px;
    padding:9px 13px;font-size:14.5px;white-space:nowrap}
  .knopka:active{background:var(--line-2)}
  .knopka--glavnaya{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .knopka--tihaya{border-color:transparent;background:transparent;color:var(--ink-2)}
  .knopka--opasnaya{color:var(--alarm);border-color:#E9C9C6}
  .knopka--shir{width:100%;padding:13px;font-size:16px}

  /* Поиск и фильтры прокручиваются вбок: на узком телефоне в строку
     не влезают, а переносить их на две строки — съедать половину экрана. */
  .iskat{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font:inherit;background:var(--paper);color:var(--ink)}
  .filtry{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:3px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filtry::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;
    padding:7px 13px;font-size:14px;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ===== Карточка объекта ===== */
  .spisok{margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .kart{background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;text-align:left;width:100%;display:block}
  .kart:active{background:var(--accent-soft)}
  .kart__verh{display:flex;align-items:baseline;gap:9px}
  .kart__imya{flex:1;font-weight:700;font-size:17px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kart__niz{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:7px;
    font-size:13.5px;color:var(--ink-2)}
  .kart__srok{font-weight:600}
  .kart__srok--gorit{color:var(--alarm)}
  .bejdzh{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
  .bejdzh--rabota{background:var(--accent-soft);color:#8A5406}
  .bejdzh--sdan{background:var(--ok-soft);color:var(--ok)}
  .bejdzh--otkaz{background:var(--line-2);color:var(--muted)}

  .pusto{background:var(--paper);border:1px dashed var(--line);border-radius:12px;
    padding:26px 18px;text-align:center;color:var(--ink-2);margin-top:12px}
  .pusto b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

  /* ===== Нижняя кнопка ===== */
  .pod{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(246,243,237,0) 0%,var(--tint) 38%)}
  .pod .obolochka{padding:0 12px}

  /* ===== Экран объекта ===== */
  .ekran{position:fixed;inset:0;z-index:40;background:var(--tint);overflow-y:auto;
    -webkit-overflow-scrolling:touch;padding-bottom:40px}
  .ekran[hidden]{display:none}
  .list{background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-top:11px}
  .list h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);
    margin:0 0 11px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}

  label.p{display:block;margin-bottom:12px}
  label.p span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  label.p input,label.p textarea,label.p select{width:100%;font:inherit;color:var(--ink);
    background:var(--tint);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
  label.p input:focus,label.p textarea:focus,label.p select:focus{
    outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
  label.p textarea{min-height:92px;resize:vertical;line-height:1.5}
  .para{display:flex;gap:10px}
  .para label.p{flex:1;min-width:0}
  .podskazka{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}

  .svyaz{display:flex;gap:8px;margin-bottom:12px}
  .svyaz a{flex:1;text-align:center;text-decoration:none;color:#fff;background:var(--ok);
    border-radius:10px;padding:12px;font-weight:600;font-size:15px}
  .svyaz a.vtor{background:var(--ink-2)}

  .etapy{display:flex;flex-wrap:wrap;gap:7px}
  .etapy .chip{flex:0 0 auto}

  .zapis{display:flex;flex-direction:column;gap:8px}
  .zapis textarea{min-height:76px}
  .istoriya{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  .istoriya li{border-left:3px solid var(--line);padding:1px 0 1px 11px}
  .istoriya time{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .istoriya p{margin:0;white-space:pre-wrap;word-wrap:break-word}
  .istoriya button{margin-top:4px;border:0;background:none;padding:0;
    font-size:12.5px;color:var(--alarm);text-decoration:underline}

  .dengi{display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid var(--line-2);margin-top:4px;padding-top:11px}
  .dengi b{font-size:20px}
  .dengi.minus b{color:var(--alarm)}

  /* ===== Отчёт ===== */
  .otchet-blok{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .plitka{flex:1 1 140px;background:var(--tint);border:1px solid var(--line-2);
    border-radius:10px;padding:11px 12px}
  .plitka span{display:block;font-size:12.5px;color:var(--muted)}
  .plitka b{display:block;font-size:19px;margin-top:3px}
  .stroka{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--line-2);font-size:14.5px}
  .stroka:last-child{border-bottom:0}
  .stroka em{font-style:normal;color:var(--muted);white-space:nowrap}
  .stroka em.gorit{color:var(--alarm);font-weight:600}

  .sned{font-size:13px;color:var(--ink-2);background:var(--accent-soft);
    border:1px solid #F0DCB8;border-radius:10px;padding:11px 12px;margin-top:11px}
  .sned b{color:var(--ink)}
  textarea.vstavka{width:100%;min-height:120px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--tint);color:var(--ink)}
</style>
</head>
<body>

<header>
  <div class="obolochka">
    <div class="shapka">
      <h1>Объекты<small id="schet">—</small></h1>
      <button class="knopka" id="otchetBtn" type="button">Отчёт</button>
      <button class="knopka" id="kopiyaBtn" type="button">Копия</button>
    </div>
    <input class="iskat" id="iskat" type="search" placeholder="Имя, телефон, посёлок" autocomplete="off">
    <div class="filtry" id="filtry"></div>
  </div>
</header>

<main class="obolochka">
  <div class="spisok" id="spisok"></div>
</main>

<div class="pod">
  <div class="obolochka">
    <button class="knopka knopka--glavnaya knopka--shir" id="novyyBtn" type="button">+ Новый объект</button>
  </div>
</div>

<!-- Экран одного объекта -->
<section class="ekran" id="ekran" hidden aria-label="Объект">
  <header>
    <div class="obolochka">
      <div class="shapka">
        <button class="knopka knopka--tihaya" id="nazadBtn" type="button">← Все объекты</button>
        <span style="flex:1"></span>
        <button class="knopka knopka--opasnaya" id="udalitBtn" type="button">Удалить</button>
      </div>
    </div>
  </header>
  <div class="obolochka" id="telo"></div>
</section>

<!-- Экран отчёта и копии -->
<section class="ekran" id="ekranOtchet" hidden aria-label="Отчёт">
  <header>
    <div class="obolochka">
      <div class="shapka">
        <button class="knopka knopka--tihaya" id="nazadOtchet" type="button">← Все объекты</button>
      </div>
    </div>
  </header>
  <div class="obolochka" id="teloOtchet"></div>
</section>

<script>
/* ===== Хранение ===== */
var KLYUCH = "stroyinvest-obyekty-v1";
var VERSIYA = 1;
var baza = { v: VERSIYA, obj: [] };

function zagruzit() {
  try {
    var d = JSON.parse(localStorage.getItem(KLYUCH) || "null");
    if (d && d.obj && d.obj.length !== undefined) baza = d;
  } catch (e) {}
}

/* Записывать стараемся на каждое изменение: мастер закрывает страницу
   кнопкой «домой», а не крестиком, и «сохранить» нажимать не будет. */
var sohranenoKogda = 0;
function sohranit() {
  try {
    localStorage.setItem(KLYUCH, JSON.stringify(baza));
    sohranenoKogda = Date.now();
  } catch (e) {
    /* Память браузера переполнена или сайту запрещено хранить данные.
       Молчать здесь нельзя: человек будет думать, что всё записалось. */
    alert("Не удалось сохранить запись в память телефона.\n\nПроверьте, что в Safari не включён режим «Частный доступ», и сделайте копию через кнопку «Копия».");
  }
}

/* ===== Справочники ===== */
var ETAPY = ["Замер", "Договор", "Материалы", "Монтаж", "Сдан", "Отказ"];
var VIDY = ["Септик", "Дренаж", "Водоснабжение", "Отопление", "Электрика", "Автополив", "Другое"];
var FILTRY = ["В работе", "Срок подошёл", "Все", "Сданные"];
var filtr = "В работе";
var zapros = "";
var otkryt = null;      // id объекта на экране

/* ===== Мелочи ===== */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function dengi(n) { return (Number(n) || 0).toLocaleString("ru-RU") + " ₽"; }
function segodnya() { return new Date().toISOString().slice(0, 10); }
function poRusski(iso) {
  if (!iso) return "";
  var ch = iso.split("-");
  return ch.length === 3 ? ch[2] + "." + ch[1] + "." + ch[0] : iso;
}
function naydi(id) {
  for (var i = 0; i < baza.obj.length; i++) if (baza.obj[i].id === id) return baza.obj[i];
  return null;
}
function vRabote(o) { return o.etap !== "Сдан" && o.etap !== "Отказ"; }
/* «Срок подошёл» — это и просроченное, и сегодняшнее. Мастер смотрит
   в список утром, и завтрашнее ему мешает: оно ещё не горит. */
function gorit(o) { return vRabote(o) && o.kogda && o.kogda <= segodnya(); }
function ostatok(o) { return (Number(o.summa) || 0) - (Number(o.avans) || 0); }

/* ===== Список ===== */
function otobrat() {
  var q = zapros.trim().toLowerCase();
  return baza.obj.filter(function (o) {
    if (filtr === "В работе" && !vRabote(o)) return false;
    if (filtr === "Сданные" && o.etap !== "Сдан") return false;
    if (filtr === "Срок подошёл" && !gorit(o)) return false;
    if (!q) return true;
    return [o.imya, o.tel, o.adres, o.vid, o.zamer].join(" ").toLowerCase().indexOf(q) > -1;
  }).sort(function (a, b) {
    /* Наверх — то, по чему пора действовать. Дальше — у кого назначен
       ближайший срок. Объекты без срока уходят вниз: по ним ничего
       не обещано, и дёргать из-за них незачем. */
    if (gorit(a) !== gorit(b)) return gorit(a) ? -1 : 1;
    if (!!a.kogda !== !!b.kogda) return a.kogda ? -1 : 1;
    if (a.kogda && b.kogda && a.kogda !== b.kogda) return a.kogda < b.kogda ? -1 : 1;
    return (b.sozdan || 0) - (a.sozdan || 0);
  });
}

function klassBejdzha(etap) {
  if (etap === "Сдан") return " bejdzh--sdan";
  if (etap === "Отказ") return " bejdzh--otkaz";
  return " bejdzh--rabota";
}

function risovatSpisok() {
  var vse = otobrat();
  var sp = document.getElementById("spisok");

  var vsegoVRabote = baza.obj.filter(vRabote).length;
  var gorit_n = baza.obj.filter(gorit).length;
  /* «1 ждёт», но «2 ждут»: кривое согласование в шапке сразу читается
     как недоделка, а эту строчку мастер видит каждый раз. */
  var zhdet = (gorit_n % 10 === 1 && gorit_n % 100 !== 11) ? " ждёт" : " ждут";
  document.getElementById("schet").textContent =
    baza.obj.length ? (vsegoVRabote + " в работе" + (gorit_n ? ", " + gorit_n + zhdet + " сегодня" : "")) : "записей пока нет";

  if (!vse.length) {
    sp.innerHTML = '<div class="pusto">' + (baza.obj.length
      ? '<b>Здесь пусто</b>По этому фильтру ничего не нашлось. Нажмите «Все».'
      : '<b>Первый объект</b>Нажмите «+ Новый объект» внизу. Заполнять всё сразу не нужно: хватит имени и телефона, остальное допишется по ходу.')
      + '</div>';
    return;
  }

  sp.innerHTML = vse.map(function (o) {
    var srok = o.kogda
      ? '<span class="kart__srok' + (gorit(o) ? ' kart__srok--gorit' : '') + '">' +
        (gorit(o) ? "⏰ " : "") + poRusski(o.kogda) + (o.chto ? " — " + esc(o.chto) : "") + '</span>'
      : '';
    var ost = vRabote(o) && ostatok(o) > 0 && Number(o.summa)
      ? '<span>осталось ' + dengi(ostatok(o)) + '</span>' : '';
    return '<button class="kart" type="button" data-id="' + o.id + '">' +
      '<div class="kart__verh">' +
        '<span class="kart__imya">' + (esc(o.imya) || "Без имени") + '</span>' +
        '<span class="bejdzh' + klassBejdzha(o.etap) + '">' + esc(o.etap) + '</span>' +
      '</div>' +
      '<div class="kart__niz">' +
        (o.vid ? '<span>' + esc(o.vid) + '</span>' : '') +
        (o.adres ? '<span>' + esc(o.adres) + '</span>' : '') +
        ost + srok +
      '</div></button>';
  }).join("");
}

function risovatFiltry() {
  document.getElementById("filtry").innerHTML = FILTRY.map(function (f) {
    var n = f === "Срок подошёл" ? baza.obj.filter(gorit).length : 0;
    return '<button class="chip" type="button" data-f="' + f + '" aria-pressed="' + (filtr === f) + '">' +
      f + (n ? " · " + n : "") + '</button>';
  }).join("");
}

function obnovit() { risovatFiltry(); risovatSpisok(); }

/* ===== Экран объекта ===== */
function otkryt_obyekt(id) {
  var o = naydi(id);
  if (!o) return;
  otkryt = id;
  var ost = ostatok(o);

  document.getElementById("telo").innerHTML =
    '<div class="list">' +
      '<h2>Заказчик</h2>' +
      '<label class="p"><span>Имя</span><input id="f-imya" type="text" value="' + esc(o.imya) + '" placeholder="Как зовут" autocomplete="off"></label>' +
      '<label class="p"><span>Телефон</span><input id="f-tel" type="tel" inputmode="tel" value="' + esc(o.tel) + '" placeholder="+7 ..." autocomplete="off"></label>' +
      (o.tel ? '<div class="svyaz">' +
        '<a href="tel:' + esc(o.tel.replace(/[^+\d]/g, "")) + '">Позвонить</a>' +
        '<a class="vtor" href="https://wa.me/' + esc(o.tel.replace(/\D/g, "")) + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '</div>' : '') +
      '<label class="p"><span>Посёлок, адрес, как доехать</span><textarea id="f-adres" placeholder="СНТ Берёзка, уч. 14, поворот у синего забора">' + esc(o.adres) + '</textarea></label>' +
    '</div>' +

    '<div class="list">' +
      '<h2>Работа</h2>' +
      '<div class="etapy" id="vidy" style="margin-bottom:14px">' + VIDY.map(function (v) {
        return '<button class="chip" type="button" data-v="' + v + '" aria-pressed="' + (o.vid === v) + '">' + v + '</button>';
      }).join("") + '</div>' +
      '<div class="etapy" id="etapy">' + ETAPY.map(function (e) {
        return '<button class="chip" type="button" data-e="' + e + '" aria-pressed="' + (o.etap === e) + '">' + e + '</button>';
      }).join("") + '</div>' +
    '</div>' +

    '<div class="list">' +
      '<h2>Замер и условия</h2>' +
      '<label class="p"><textarea id="f-zamer" placeholder="Глубина до воды, грунт, расстояние до дома, куда отводить, что мешает подъезду">' + esc(o.zamer) + '</textarea></label>' +
      '<div class="podskazka">Диктовать удобнее, чем набирать: нажмите на поле, затем микрофон на клавиатуре телефона.</div>' +
    '</div>' +

    '<div class="list">' +
      '<h2>Деньги</h2>' +
      '<div class="para">' +
        '<label class="p"><span>Сумма договора</span><input id="f-summa" type="text" inputmode="numeric" value="' + (o.summa || "") + '" placeholder="0"></label>' +
        '<label class="p"><span>Получено</span><input id="f-avans" type="text" inputmode="numeric" value="' + (o.avans || "") + '" placeholder="0"></label>' +
      '</div>' +
      '<div class="dengi' + (ost > 0 ? " minus" : "") + '"><span>Осталось получить</span><b id="ostatok">' + dengi(ost) + '</b></div>' +
    '</div>' +

    '<div class="list">' +
      '<h2>Следующий шаг</h2>' +
      '<div class="para">' +
        '<label class="p"><span>Когда</span><input id="f-kogda" type="date" value="' + esc(o.kogda) + '"></label>' +
        '<label class="p"><span>Что сделать</span><input id="f-chto" type="text" value="' + esc(o.chto) + '" placeholder="Позвонить, привезти кольца"></label>' +
      '</div>' +
    '</div>' +

    '<div class="list">' +
      '<h2>Что происходило</h2>' +
      '<div class="zapis">' +
        '<textarea id="f-novaya" placeholder="Наговорите или напишите, что сделали и о чём договорились"></textarea>' +
        '<button class="knopka knopka--glavnaya" id="dobavitZapis" type="button">Добавить запись</button>' +
      '</div>' +
      '<ul class="istoriya" id="istoriya"></ul>' +
    '</div>';

  risovatIstoriyu();
  document.getElementById("ekran").hidden = false;
  document.getElementById("ekran").scrollTop = 0;
  document.body.style.overflow = "hidden";
  privyazat(o);
}

function risovatIstoriyu() {
  var o = naydi(otkryt);
  var ul = document.getElementById("istoriya");
  if (!o || !ul) return;
  if (!o.istoriya || !o.istoriya.length) {
    ul.innerHTML = '<li style="border-color:transparent;padding-left:0;color:#7A8792">Записей пока нет.</li>';
    return;
  }
  ul.innerHTML = o.istoriya.slice().reverse().map(function (z) {
    return '<li><time>' + esc(z.d) + '</time><p>' + esc(z.t) + '</p>' +
      '<button type="button" data-udalit="' + esc(z.id) + '">удалить</button></li>';
  }).join("");
}

/* Привязка полей. Пишем в базу на каждое касание клавиатуры: если ждать
   ухода с поля, половина наговорённого потеряется на звонке, который
   придёт посреди набора. */
function privyazat(o) {
  [["f-imya", "imya"], ["f-tel", "tel"], ["f-adres", "adres"], ["f-zamer", "zamer"],
   ["f-kogda", "kogda"], ["f-chto", "chto"]].forEach(function (p) {
    var el = document.getElementById(p[0]);
    el.addEventListener("input", function () { o[p[1]] = el.value; sohranit(); });
  });

  ["f-summa", "f-avans"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", function () {
      /* Пальцем на стройке легко промахнуться по пробелу или букве.
         Берём только цифры — на сумме это ровно то, что нужно. */
      var chisto = el.value.replace(/[^\d]/g, "");
      if (chisto !== el.value) el.value = chisto;
      o[id === "f-summa" ? "summa" : "avans"] = chisto;
      var ost = ostatok(o);
      document.getElementById("ostatok").textContent = dengi(ost);
      document.getElementById("ostatok").parentNode.classList.toggle("minus", ost > 0);
      sohranit();
    });
  });

  document.getElementById("vidy").addEventListener("click", function (e) {
    var b = e.target.closest("[data-v]"); if (!b) return;
    o.vid = (o.vid === b.getAttribute("data-v")) ? "" : b.getAttribute("data-v");
    sohranit();
    this.querySelectorAll(".chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.getAttribute("data-v") === o.vid);
    });
  });

  document.getElementById("etapy").addEventListener("click", function (e) {
    var b = e.target.closest("[data-e]"); if (!b) return;
    var byl = o.etap;
    o.etap = b.getAttribute("data-e");
    this.querySelectorAll(".chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.getAttribute("data-e") === o.etap);
    });
    /* Смена этапа — главное событие объекта. Записываем её в историю сами:
       иначе через месяц не вспомнить, когда именно сдали. */
    if (byl !== o.etap) zapisat(o, "Этап: " + byl + " → " + o.etap);
    sohranit();
  });

  document.getElementById("dobavitZapis").addEventListener("click", function () {
    var ta = document.getElementById("f-novaya");
    var t = ta.value.trim();
    if (!t) { ta.focus(); return; }
    zapisat(o, t);
    ta.value = "";
    sohranit();
  });

  document.getElementById("istoriya").addEventListener("click", function (e) {
    var b = e.target.closest("[data-udalit]"); if (!b) return;
    if (!confirm("Удалить эту запись?")) return;
    o.istoriya = (o.istoriya || []).filter(function (z) { return z.id !== b.getAttribute("data-udalit"); });
    sohranit(); risovatIstoriyu();
  });
}

function zapisat(o, tekst) {
  o.istoriya = o.istoriya || [];
  o.istoriya.push({
    id: String(Date.now()) + String(Math.random()).slice(2, 7),
    d: new Date().toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
    t: tekst
  });
  risovatIstoriyu();
}

function zakryt() {
  document.getElementById("ekran").hidden = true;
  document.body.style.overflow = "";
  otkryt = null;
  obnovit();
}

/* ===== Отчёт и копия ===== */
function otkryt_otchet() {
  var rab = baza.obj.filter(vRabote);
  var summa = rab.reduce(function (s, o) { return s + (Number(o.summa) || 0); }, 0);
  var poluchen = rab.reduce(function (s, o) { return s + (Number(o.avans) || 0); }, 0);
  var goryat = baza.obj.filter(gorit);

  var nedelya = new Date(); nedelya.setDate(nedelya.getDate() + 7);
  var predel = nedelya.toISOString().slice(0, 10);
  var skoro = baza.obj.filter(function (o) {
    return vRabote(o) && o.kogda && o.kogda > segodnya() && o.kogda <= predel;
  }).sort(function (a, b) { return a.kogda < b.kogda ? -1 : 1; });

  var poEtapam = ETAPY.map(function (e) {
    return { e: e, n: baza.obj.filter(function (o) { return o.etap === e; }).length };
  }).filter(function (x) { return x.n; });

  function spisochek(massiv, pusto) {
    if (!massiv.length) return '<div class="stroka"><span style="color:#7A8792">' + pusto + '</span></div>';
    return massiv.map(function (o) {
      return '<div class="stroka"><span>' + (esc(o.imya) || "Без имени") +
        (o.chto ? " — " + esc(o.chto) : "") + '</span>' +
        '<em' + (gorit(o) ? ' class="gorit"' : '') + '>' + poRusski(o.kogda) + '</em></div>';
    }).join("");
  }

  document.getElementById("teloOtchet").innerHTML =
    '<div class="list">' +
      '<h2>Сейчас в работе</h2>' +
      '<div class="otchet-blok">' +
        '<div class="plitka"><span>Объектов</span><b>' + rab.length + '</b></div>' +
        '<div class="plitka"><span>На сумму</span><b>' + dengi(summa) + '</b></div>' +
        '<div class="plitka"><span>Получено</span><b>' + dengi(poluchen) + '</b></div>' +
        '<div class="plitka"><span>Ждём получить</span><b>' + dengi(summa - poluchen) + '</b></div>' +
      '</div>' +
      poEtapam.map(function (x) {
        return '<div class="stroka"><span>' + x.e + '</span><em>' + x.n + '</em></div>';
      }).join("") +
    '</div>' +

    '<div class="list">' +
      '<h2>Пора действовать</h2>' + spisochek(goryat, "Ничего не просрочено.") +
    '</div>' +

    '<div class="list">' +
      '<h2>Ближайшая неделя</h2>' + spisochek(skoro, "На неделю ничего не назначено.") +
    '</div>' +

    '<div class="list">' +
      '<h2>Копия записей</h2>' +
      '<p style="margin:0 0 12px;font-size:14.5px;color:#4A5A64">Записи лежат в этом телефоне. Если почистить данные Safari или сменить телефон — они пропадут. Копию стоит делать раз в неделю.</p>' +
      '<button class="knopka knopka--glavnaya knopka--shir" id="skachat" type="button">Скачать файл копии</button>' +
      '<div style="height:8px"></div>' +
      '<button class="knopka knopka--shir" id="vTelegram" type="button">Скопировать текстом (в Telegram)</button>' +
      '<div style="height:8px"></div>' +
      '<button class="knopka knopka--shir" id="vTablicu" type="button">Скачать таблицу для Excel</button>' +
      '<div class="sned"><b>Куда класть копию.</b> Самое простое — отправить файл самому себе в Telegram, в «Избранное». Он там и останется, и с него можно восстановить всё на новом телефоне.</div>' +
    '</div>' +

    '<div class="list">' +
      '<h2>Восстановить из копии</h2>' +
      '<p style="margin:0 0 10px;font-size:14.5px;color:#4A5A64">Вставьте сюда содержимое файла копии и нажмите кнопку. Текущие записи заменятся.</p>' +
      '<textarea class="vstavka" id="vstavka" placeholder="Сюда вставить текст из файла копии"></textarea>' +
      '<div style="height:8px"></div>' +
      '<button class="knopka knopka--opasnaya knopka--shir" id="vosstanovit" type="button">Заменить записи из копии</button>' +
    '</div>';

  document.getElementById("skachat").addEventListener("click", skachatKopiyu);
  document.getElementById("vTelegram").addEventListener("click", skopirovatTekstom);
  document.getElementById("vTablicu").addEventListener("click", skachatTablicu);
  document.getElementById("vosstanovit").addEventListener("click", vosstanovitIzKopii);

  document.getElementById("ekranOtchet").hidden = false;
  document.getElementById("ekranOtchet").scrollTop = 0;
  document.body.style.overflow = "hidden";
}

function skachatFayl(imya, tekst, tip) {
  var b = new Blob(["﻿" + tekst], { type: tip + ";charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = imya;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function skachatKopiyu() {
  skachatFayl("obyekty-" + segodnya() + ".txt", JSON.stringify(baza), "text/plain");
}

function tekstomVse() {
  var ch = ["ОБЪЕКТЫ СтройИнвест — копия от " + poRusski(segodnya()), ""];
  baza.obj.forEach(function (o) {
    ch.push("— " + (o.imya || "Без имени") + " · " + o.etap + (o.vid ? " · " + o.vid : ""));
    if (o.tel) ch.push("  тел " + o.tel);
    if (o.adres) ch.push("  " + o.adres.replace(/\n/g, " "));
    if (o.summa) ch.push("  сумма " + dengi(o.summa) + ", получено " + dengi(o.avans) + ", осталось " + dengi(ostatok(o)));
    if (o.kogda) ch.push("  " + poRusski(o.kogda) + (o.chto ? " — " + o.chto : ""));
    if (o.zamer) ch.push("  замер: " + o.zamer.replace(/\n/g, "; "));
    (o.istoriya || []).forEach(function (z) { ch.push("  " + z.d + " " + z.t.replace(/\n/g, " ")); });
    ch.push("");
  });
  return ch.join("\n");
}

function skopirovatTekstom() {
  var t = tekstomVse();
  var knopka = document.getElementById("vTelegram");
  function poluchilos() { knopka.textContent = "Скопировано — вставьте в Telegram"; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(poluchilos, function () { zapasnoeKopirovanie(t, poluchilos); });
  } else { zapasnoeKopirovanie(t, poluchilos); }
}

/* Старый способ копирования. Нужен там, где новый запрещён: Safari
   отдаёт буфер обмена не всегда, и без запасного пути кнопка просто
   молчала бы. */
function zapasnoeKopirovanie(t, poluchilos) {
  var ta = document.createElement("textarea");
  ta.value = t;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.focus(); ta.setSelectionRange(0, t.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (ok) poluchilos(); else skachatFayl("obyekty-" + segodnya() + ".txt", t, "text/plain");
}

function skachatTablicu() {
  var shapka = ["Имя", "Телефон", "Адрес", "Вид работ", "Этап", "Сумма", "Получено", "Осталось", "Срок", "Что сделать", "Замер"];
  function kl(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""').replace(/\n/g, " ") + '"'; }
  var stroki = baza.obj.map(function (o) {
    return [o.imya, o.tel, o.adres, o.vid, o.etap, Number(o.summa) || 0, Number(o.avans) || 0,
            ostatok(o), poRusski(o.kogda), o.chto, o.zamer].map(kl).join(";");
  });
  /* Точка с запятой, а не запятая: русский Excel делит столбцы именно так,
     иначе вся строка попадёт в первую клетку. */
  skachatFayl("obyekty-" + segodnya() + ".csv", [shapka.map(kl).join(";")].concat(stroki).join("\r\n"), "text/csv");
}

function vosstanovitIzKopii() {
  var t = document.getElementById("vstavka").value.trim();
  if (!t) { alert("Сначала вставьте текст из файла копии."); return; }
  var d;
  try { d = JSON.parse(t); } catch (e) { d = null; }
  if (!d || !d.obj || d.obj.length === undefined) {
    alert("Это не похоже на файл копии.\n\nНужен файл, который скачивается кнопкой «Скачать файл копии» — он начинается с {\"v\":1.");
    return;
  }
  if (!confirm("Заменить все записи на телефоне (" + baza.obj.length + " шт.) записями из копии (" + d.obj.length + " шт.)?\n\nТекущие записи пропадут.")) return;
  baza = d;
  sohranit();
  document.getElementById("ekranOtchet").hidden = true;
  document.body.style.overflow = "";
  obnovit();
  alert("Записи восстановлены: " + baza.obj.length + " шт.");
}

/* ===== Общие кнопки ===== */
document.getElementById("spisok").addEventListener("click", function (e) {
  var b = e.target.closest("[data-id]"); if (!b) return;
  otkryt_obyekt(b.getAttribute("data-id"));
});

document.getElementById("filtry").addEventListener("click", function (e) {
  var b = e.target.closest("[data-f]"); if (!b) return;
  filtr = b.getAttribute("data-f");
  obnovit();
});

document.getElementById("iskat").addEventListener("input", function () {
  zapros = this.value; risovatSpisok();
});

document.getElementById("novyyBtn").addEventListener("click", function () {
  var o = { id: String(Date.now()), sozdan: Date.now(), imya: "", tel: "", adres: "",
            vid: "", etap: "Замер", summa: "", avans: "", kogda: "", chto: "", zamer: "", istoriya: [] };
  baza.obj.push(o);
  sohranit();
  otkryt_obyekt(o.id);
  document.getElementById("f-imya").focus();
});

document.getElementById("nazadBtn").addEventListener("click", function () {
  /* Пустой объект, заведённый случайно, убираем сами: иначе список
     за неделю зарастёт карточками «Без имени», которые никто не удалит. */
  var o = naydi(otkryt);
  if (o && !o.imya && !o.tel && !o.adres && !o.zamer && !o.summa && !(o.istoriya || []).length) {
    baza.obj = baza.obj.filter(function (x) { return x.id !== o.id; });
    sohranit();
  }
  zakryt();
});

document.getElementById("udalitBtn").addEventListener("click", function () {
  var o = naydi(otkryt); if (!o) return;
  if (!confirm("Удалить объект «" + (o.imya || "Без имени") + "» со всеми записями?\n\nВернуть будет нельзя.")) return;
  baza.obj = baza.obj.filter(function (x) { return x.id !== o.id; });
  sohranit();
  zakryt();
});

document.getElementById("otchetBtn").addEventListener("click", otkryt_otchet);
document.getElementById("kopiyaBtn").addEventListener("click", function () {
  otkryt_otchet();
  var el = document.getElementById("skachat");
  if (el) el.scrollIntoView({ block: "center" });
});
document.getElementById("nazadOtchet").addEventListener("click", function () {
  document.getElementById("ekranOtchet").hidden = true;
  document.body.style.overflow = "";
  obnovit();
});

/* Телефон может выгрузить страницу из памяти без предупреждения.
   Сохраняем ещё раз на уход со страницы — дешевле, чем потерянный замер. */
window.addEventListener("pagehide", function () { try { localStorage.setItem(KLYUCH, JSON.stringify(baza)); } catch (e) {} });

zagruzit();
obnovit();

/* Запас на случай «нет связи» — см. obyekty-sw.js. Если браузер старый
   или страницу открыли по http, молча работаем без запаса: это улучшение,
   а не условие работы. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("obyekty-sw.js").catch(function () {});
  });
}
</script>
