<!-- Размер задаётся окном браузера, а не этим файлом: из одного шаблона

     и при другом размере окна низ картинки оставался белым — именно так
     и получилась иконка сайта с белой полосой снизу. -->
<!-- Иконка для телефонов (apple-touch-icon.png, 180×180). Цвета те же, что

     Линии воды здесь оставлены намеренно: в маленьком квадрате они не дают
     капле читаться как огонёк. На аватарках их нет — там знак крупный. -->

  <path d="M16 6c0 0 6 7.2 6 11a6 6 0 1 1-12 0c0-3.8 6-11 6-11z" fill="#F0A62E"/>
