<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTX — The world model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS + GLOBALS
   ============================================================ */
:root {
  --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: #fff;
  font-family: 'Manrope', system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: 'Manrope', system-ui, sans-serif;
  color: inherit;
}

::selection { background: rgba(255, 255, 255, 0.2); }

:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   STAGE + MEDIA
   ============================================================ */
.stage {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #000;
}

.media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: 0;
  pointer-events: none;
  visibility: hidden;
}

.media.is-visible { visibility: visible; }

/* ============================================================
   HERO COPY
   ============================================================ */
.hero {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.hero h1 {
  position: absolute;
  top: 35.9%;
  left: 50%;
  transform: translateX(-50%);
  width: min(901px, calc(100vw - 48px));
  margin: 0;
  text-align: center;
  font-size: clamp(62px, 6.8vw, 100px);
  font-weight: 500;
  line-height: 0.8;
  letter-spacing: -0.04em;
  white-space: nowrap;
  text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
}

.hero h1 span {
  display: inline-block;
  opacity: 1;
  filter: blur(0px);
  transform: translateY(0);
  transition:
    opacity 900ms var(--retake-ease),
    filter 900ms var(--retake-ease),
    transform 900ms var(--retake-ease);
}

.hero h1 span:nth-child(1) { transition-delay: 0ms; }
.hero h1 span:nth-child(2) { transition-delay: 90ms; }
.hero h1 span:nth-child(3) { transition-delay: 180ms; }

.stage.title-hidden .hero h1 span {
  opacity: 0;
  filter: blur(12px);
  transform: translateY(-10px);
}

.hero p {
  position: absolute;
  top: calc(46.78% + 94px);
  left: 50%;
  transform: translateX(-50%);
  width: min(734px, calc(100vw - 48px));
  margin: 0;
  text-align: center;
  font-size: clamp(14px, 1.25vw, 18px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.04em;
  text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
}

/* ============================================================
   CONTROLLER
   ============================================================ */
.controller {
  position: absolute;
  top: 46.78%;
  left: 50%;
  transform: translateX(-50%);
  width: min(880px, calc(100vw - 48px));
  height: 72px;
  z-index: 20;
}

/* --- glass material shared shell --- */
.glass {
  position: absolute;
  border-radius: 999px;
  pointer-events: none;
}

.glass::before,
.glass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}

.glass::before {
  background:
    radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%),
                    rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
    linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
}

.glass::after {
  padding: 1px;
  background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff,
                             #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}

/* --- rear track --- */
.track {
  top: 4px;
  left: 0;
  width: 100%;
  height: 64px;
  opacity: 1;
  background: rgb(24 55 82 / 0.31);
  border: 1px solid rgb(255 255 255 / 0.2);
  -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
          backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
  box-shadow:
    0 14px 38px rgb(4 24 43 / 0.16),
    0 2px 7px rgb(4 24 43 / 0.1),
    inset 1px 1px 0 rgb(255 255 255 / 0.48),
    inset -1px -1px 0 rgb(21 49 73 / 0.14),
    inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    opacity 520ms linear;
}

.track::after { opacity: 0.27; }

/* --- foreground capsule --- */
.capsule {
  top: -1px; /* -5px relative to the track, which itself sits at 4px */
  left: var(--cap-left, -5px);
  width: var(--cap-width, calc(20% + 5px));
  height: 72px;
  background: rgb(246 251 255 / 0.24);
  border: 1px solid rgb(255 255 255 / 0.28);
  -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
          backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
  box-shadow:
    0 11px 28px rgb(4 24 43 / 0.17),
    0 2px 6px rgb(4 24 43 / 0.1),
    inset 1px 1px 0 rgb(255 255 255 / 0.62),
    inset -1px -1px 0 rgb(20 49 73 / 0.18),
    inset 0 0 12px rgb(255 255 255 / 0.055);
  transition:
    left 620ms var(--retake-ease),
    width 620ms var(--retake-ease),
    background 620ms var(--retake-ease),
    opacity 420ms var(--retake-ease);
}

.capsule::after { opacity: 0.30; }

/* --- cells --- */
.cells {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
}

.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0 14px;
  font-size: 23px;
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.04em;
  white-space: nowrap;
  color: #fff;
  opacity: 1;
  filter: blur(0px);
  transform: none;
  transition:
    opacity 420ms var(--retake-ease),
    filter 420ms var(--retake-ease),
    transform 980ms var(--retake-slow-ease);
}

button.cell {
  background: transparent;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  font-family: 'Manrope', system-ui, sans-serif;
  -webkit-appearance: none;
          appearance: none;
}

button.cell[disabled] { cursor: default; }

.controller.hot .cell.label {
  opacity: 0.5;
  transition:
    opacity 300ms var(--retake-ease),
    filter 420ms var(--retake-ease),
    transform 980ms var(--retake-slow-ease);
}

/* --- collapsed / selected --- */
.controller.collapsed .capsule {
  left: calc(50% - 100px);
  width: 200px;
  background: rgb(246 251 255 / 0.14);
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    background 980ms var(--retake-slow-ease),
    opacity 420ms var(--retake-ease);
}

.controller.collapsed .track {
  left: calc(50% - 96px);
  width: 192px;
}

.controller.rear-out .track {
  opacity: 0;
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    opacity 400ms linear 650ms;
}

.controller.collapsed .cell:not(.chosen) {
  opacity: 0;
  filter: blur(10px);
  transform: scale(0.94);
  pointer-events: none;
}

.controller.collapsed .cell.chosen {
  transform: translate(var(--tx, 0px), var(--ty, 0px));
}

.controller.expanding .capsule,
.controller.expanding .track {
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    background 980ms var(--retake-slow-ease),
    opacity 520ms linear;
}

.controller.restoring .cell {
  transition:
    opacity 760ms var(--retake-ease) 60ms,
    filter 760ms var(--retake-ease) 60ms,
    transform 980ms var(--retake-slow-ease);
}

.cell.swap-out {
  opacity: 0;
  filter: blur(8px);
  transition:
    opacity 300ms var(--retake-ease),
    filter 300ms var(--retake-ease),
    transform 980ms var(--retake-slow-ease);
}

.cell.is-reset {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  animation: resetReveal 520ms var(--retake-ease) both;
}

@keyframes resetReveal {
  from { opacity: 0; filter: blur(10px); }
  to   { opacity: 1; filter: blur(0px); }
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 30;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
  text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
}

.brand {
  display: flex;
  align-items: center;
}

.brand a {
  display: inline-flex;
  align-items: center;
  line-height: 0;
}

.brand svg {
  height: 24px;
  width: auto;
  display: block;
}

.meta {
  display: flex;
  align-items: center;
  margin-left: clamp(48px, 5vw, 70px);
  gap: clamp(28px, 3vw, 44px);
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: -0.04em;
}

.try-now {
  grid-column: 3;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 152px;
  height: 38px;
  border-radius: 999px;
  border: 1px solid rgb(255 255 255 / 0.75);
  background: transparent;
  color: #fff;
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: -0.04em;
  text-decoration: none;
  transition:
    color 300ms var(--retake-ease),
    background-color 300ms var(--retake-ease),
    border-color 300ms var(--retake-ease);
}

.try-now:hover,
.try-now:focus-visible {
  background: #fff;
  color: #0b1a26;
  border-color: #fff;
}

/* ============================================================
   NOTICE (errors / retry)
   ============================================================ */
.notice {
  position: absolute;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: calc(100vw - 32px);
  padding: 12px 16px 12px 20px;
  border-radius: 999px;
  background: rgb(24 55 82 / 0.42);
  border: 1px solid rgb(255 255 255 / 0.24);
  -webkit-backdrop-filter: blur(9px) saturate(126%);
          backdrop-filter: blur(9px) saturate(126%);
  font-size: 15px;
  letter-spacing: -0.03em;
}

.notice[hidden] { display: none; }

.notice button {
  min-height: 44px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid rgb(255 255 255 / 0.75);
  background: transparent;
  color: #fff;
  font-size: 15px;
  letter-spacing: -0.03em;
  cursor: pointer;
  transition:
    color 300ms var(--retake-ease),
    background-color 300ms var(--retake-ease);
}

.notice button:hover,
.notice button:focus-visible {
  background: #fff;
  color: #0b1a26;
}

/* ============================================================
   RESPONSIVE — 900
   ============================================================ */
@media (max-width: 900px) {
  .site-header { padding: calc(24px + env(safe-area-inset-top)) 24px 24px; }
  .meta { font-size: 14px; gap: 22px; margin-left: 34px; }
  .try-now { width: 116px; height: 36px; font-size: 14px; }
  .cell { font-size: clamp(17px, 2.5vw, 24px); }
}

/* ============================================================
   RESPONSIVE — 700
   ============================================================ */
@media (max-width: 700px) {
  .site-header { padding-left: 18px; padding-right: 18px; }
  .brand svg { height: 21px; }
  .meta { font-size: 12px; }
  .meta .meta-2 { display: none; }

  .try-now { width: 92px; height: 34px; font-size: 13px; }
  .try-now::after {
    content: '';
    position: absolute;
    inset: -6px -10px;
  }

  .hero h1 {
    top: 34%;
    width: calc(100vw - 40px);
    font-size: clamp(48px, 14vw, 64px);
    line-height: 0.88;
    white-space: normal;
  }

  .hero p {
    top: 77%;
    width: calc(100vw - 44px);
    font-size: 14px;
  }

  .controller {
    top: 53%;
    width: calc(100vw - 40px);
    height: 156px;
  }

  .track {
    top: 0;
    height: 156px;
    border-radius: 28px;
  }

  .cells {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: 48px 54px 54px;
  }

  .cell { font-size: 17px; }
  .cell.label { grid-column: 1 / -1; }

  /* square corners so the 1px dividers read as straight grid rules
     rather than bending around a 999px radius */
  .cells .opt { border-radius: 0; border-top: 1px solid rgb(255 255 255 / 0.12); }
  .cells .opt:nth-child(3),
  .cells .opt:nth-child(5) { border-left: 1px solid rgb(255 255 255 / 0.12); }

  /* the travelling label must not carry a divider into the capsule */
  .controller.collapsed .cells .opt { border-color: transparent; }

  .cells .opt:active { background: rgb(255 255 255 / 0.07); }
  .cells .opt:focus-visible { outline-offset: -3px; }

  /* the sliding hover capsule is off on touch layouts */
  .capsule { opacity: 0; pointer-events: none; }

  /* collapsed track keeps its footprint and simply fades under the capsule */
  .controller.collapsed .track { left: 0; width: 100%; }

  .controller.collapsed .capsule {
    opacity: 1;
    left: 50%;
    top: 4vh;
    top: 4dvh;
    transform: translate(-50%, -50%);
    width: 196px;
    height: 64px;
    border-radius: 999px;
    background: rgb(246 251 255 / 0.18);
  }
}

/* ============================================================
   RESPONSIVE — short phones
   ============================================================ */
@media (max-width: 700px) and (max-height: 700px) {
  .controller { top: 50%; }
  .hero p {
    top: calc(50% + 168px);
    width: calc(100vw - 32px);
    font-size: 13px;
  }
}

/* ============================================================
   RESPONSIVE — landscape
   ============================================================ */
@media (max-height: 520px) and (orientation: landscape) {
  .hero h1 {
    top: 20%;
    font-size: clamp(34px, 8vh, 56px);
  }
  .controller { top: 50%; }
  .hero p {
    top: auto;
    bottom: 8px;
    font-size: 13px;
  }
}

@media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
  .hero h1 {
    top: 12%;
    font-size: clamp(28px, 7vh, 44px);
  }
  .controller {
    top: 46%;
    height: 118px;
  }
  .track { height: 118px; }
  .cells { grid-template-rows: 36px 41px 41px; }
  .cell { font-size: 15px; }
  .hero p { bottom: 6px; font-size: 12px; }
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .capsule,
  .track,
  .cell,
  .hero h1 span,
  .try-now,
  .controller.collapsed .capsule,
  .controller.collapsed .track,
  .controller.rear-out .track,
  .controller.expanding .capsule,
  .controller.expanding .track,
  .controller.restoring .cell,
  .controller.hot .cell.label,
  .cell.swap-out {
    transition-duration: 1ms !important;
    transition-delay: 0ms !important;
  }

  .hero h1 span,
  .cell,
  .stage.title-hidden .hero h1 span,
  .controller.collapsed .cell:not(.chosen),
  .cell.swap-out {
    filter: none !important;
  }

  .cell.is-reset { animation-duration: 1ms; }
}
</style>
</head>
<body>

<main class="stage" id="stage">

  <!-- ===== MEDIA: eight persistent clips, fixed src, never remounted ===== -->
  <video class="media" id="v1f" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v1r" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v2f" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v2r" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v3f" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v3r" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v4f" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="media" id="v4r" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

  <!-- ===== HERO ===== -->
  <div class="hero">
    <h1><span>The</span> <span>world</span> <span>model</span></h1>
    <p>LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.</p>
  </div>

  <!-- ===== CONTROLLER ===== -->
  <div class="controller" id="controller" role="group" aria-label="Scene state controller">
    <div class="track glass" aria-hidden="true"></div>
    <div class="capsule glass" id="capsule" aria-hidden="true"></div>
    <div class="cells">
      <div class="cell label" id="selectLabel" aria-hidden="true">Select state &rarr;</div>
      <button type="button" class="cell opt" data-branch="scene" disabled>Scene</button>
      <button type="button" class="cell opt" data-branch="light" disabled>Lighting</button>
      <button type="button" class="cell opt" data-branch="colorway" disabled>Clothing</button>
      <button type="button" class="cell opt" data-branch="fullLook" disabled>Cast</button>
    </div>
  </div>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="brand">
      <a href="https://www.ltx.io/" aria-label="LTX home">
        <svg viewBox="0 0 75 32" role="img" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path fill="#ffffff" d="M0 0h6.5v25.5H16V32H0z"></path>
          <path fill="#ffffff" d="M20 0h24.5v6.5h-9V32h-6.5V6.5h-9z"></path>
          <path fill="#ffffff" d="M49 0h6.5L62 10.67 68.5 0H75l-9.75 16L75 32h-6.5L62 21.33 55.5 32H49l9.75-16z"></path>
        </svg>
      </a>
      <div class="meta">
        <span class="meta-1">LTX-2.5 is here</span>
        <span class="meta-2">Smarter. Faster</span>
      </div>
    </div>
    <a class="try-now" href="https://app.ltx.io/" target="_blank" rel="noopener noreferrer">Try now</a>
  </header>

  <!-- ===== STATUS + NOTICE ===== -->
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <div class="notice" id="notice" hidden>
    <span id="noticeText"></span>
    <button type="button" id="retryBtn">Retry</button>
  </div>

</main>

<script>
(function () {
  'use strict';

  /* ==========================================================
     CONFIG
     ========================================================== */
  var HOLD_GUARD = 0.08;        /* seconds before duration, default */
  var SCENE_REVERSE_GUARD = 0.18; /* verified empirically for video-2-reverse */
  var FIRST_FRAME_TIMEOUT = 12000;
  var SEEK_TIMEOUT = 6000;

  var BRANCHES = {
    scene:    { label: 'Scene',    state: 'scene',    fwd: 'v2f', rev: 'v2r', fwdDur: 2.08, revDur: 2.08, fwdGuard: HOLD_GUARD, revGuard: SCENE_REVERSE_GUARD },
    light:    { label: 'Lighting', state: 'light',    fwd: 'v3f', rev: 'v3r', fwdDur: 2.08, revDur: 2.04, fwdGuard: HOLD_GUARD, revGuard: HOLD_GUARD },
    colorway: { label: 'Clothing', state: 'colorway', fwd: 'v1f', rev: 'v1r', fwdDur: 2.08, revDur: 2.08, fwdGuard: HOLD_GUARD, revGuard: HOLD_GUARD },
    fullLook: { label: 'Cast',     state: 'fullLook', fwd: 'v4f', rev: 'v4r', fwdDur: 3.00, revDur: 2.48, fwdGuard: HOLD_GUARD, revGuard: HOLD_GUARD }
  };

  var BRANCH_KEYS = ['scene', 'light', 'colorway', 'fullLook'];

  /* capsule rail positions: index 0 is the label, 1-4 the buttons.
     The 5px protrusion at both ends keeps the outer labels from pinching. */
  var CAP = [
    { left: '-5px', width: 'calc(20% + 5px)' },
    { left: '20%',  width: '20%' },
    { left: '40%',  width: '20%' },
    { left: '60%',  width: '20%' },

    state.playback = 'ready';
    transition(attempt.key, attempt.dir);
  });

  /* ==========================================================
     BOOT
     ========================================================== */
  moveCapsule(0);
  announce('Loading scene transitions.');
  for (i = 0; i < VIDEO_IDS.length; i++) { watchReadiness(VIDEO_IDS[i]); }
  refreshReadiness();
}());
</script>
